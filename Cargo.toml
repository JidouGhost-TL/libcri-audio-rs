[package]
name = "libcri-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/JidouGhost-TL/libcri-audio-rs"
description = "Standalone pure-Rust CRI Middleware ADX and HCA cross-console audio codec"
keywords = ["cri", "adx", "hca", "audio", "codec"]
categories = ["multimedia::audio", "emulators", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]

[[bench]]
name = "bench_audio"
harness = false
